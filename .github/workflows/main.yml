name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS App
        run: |
          xcodebuild archive \
            -project VirtualController.xcodeproj \
            -scheme ControllerApp \
            -sdk iphoneos \
            -archivePath build/ControllerApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create Payload and IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ControllerApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r VirtualController.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualController-IPA
          path: build/VirtualController.ipa
